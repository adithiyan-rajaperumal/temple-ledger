<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="jainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Circular Amber Gradient Background -->
  <rect width="100" height="100" rx="28" fill="url(#jainGradient)" />

  <g fill="#ffffff" color="#ffffff" transform="translate(6, 6) scale(0.88)">
    <!-- 1. Siddhashila & Siddha Dot -->
    <circle cx="50" cy="5" r="2.5" />
    <path d="M 33 10 Q 50 17 67 10 Q 50 13 33 10 Z" />

    <!-- 2. Ratnatraya (Three Jewels) -->
    <circle cx="41" cy="17" r="2.2" />
    <circle cx="50" cy="17" r="2.2" />
    <circle cx="59" cy="17" r="2.2" />

    <!-- 3. Sacred Ahimsa Hand (Abhaya Mudra) -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="
        M 43 94
        C 43 94, 38 88, 33 80
        C 28 72, 22 64, 21 54
        C 20 46, 23 42, 28 43
        C 32 44, 34 50, 36 56
        C 36 51, 36 39, 36 27
        C 36 21, 43 21, 43 27
        L 43 32
        L 44 24
        C 44 18, 51 18, 51 24
        L 51 32
        L 52 26
        C 52 20, 59 20, 59 26
        L 59 36
        L 60 32
        C 60 26, 67 26, 67 32
        C 67 44, 70 54, 71 63
        C 72 73, 66 84, 57 94
        Z

        M 50 51
        A 15 15 0 1 0 50 81
        A 15 15 0 1 0 50 51
        Z
      "
    />

    <!-- 4. Dharmachakra (Wheel of Dharma with 24 Spokes) -->
    <g transform="translate(50, 66)">
      <circle cx="0" cy="0" r="14.5" fill="none" stroke="#ffffff" stroke-width="2.4" />
      <circle cx="0" cy="0" r="3.6" fill="#ffffff" />
      
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(15)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(30)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(45)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(60)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(75)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(90)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(105)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(120)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(135)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(150)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(165)" />
    </g>
  </g>
</svg>
